name: Device tests

on:
  workflow_dispatch:
  push:
    branches: ['fix/**']

permissions:
  contents: read
  packages: read

jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ORG_GRADLE_PROJECT_gprUser: aezochka
      ORG_GRADLE_PROJECT_gprToken: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android platform 37
        run: yes | sdkmanager "platforms;android-37" > /dev/null || true
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build test APKs
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon
      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            adb logcat -c || true
            adb logcat -v time > logcat.txt 2>&1 &
            ./gradlew :app:connectedDebugAndroidTest --no-daemon || echo "TESTS_FAILED" > failed.flag
            sleep 2
            adb exec-out screencap -p > screen.png || true
            grep -A40 -E "FATAL EXCEPTION|AndroidRuntime" logcat.txt | head -200 > crash.txt || true
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: device-test
          path: |
            logcat.txt
            crash.txt
            screen.png
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
      - name: Fail on test failure
        run: test ! -f failed.flag
