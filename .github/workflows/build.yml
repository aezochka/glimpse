name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ORG_GRADLE_PROJECT_gprUser: aezochka
      ORG_GRADLE_PROJECT_gprToken: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android platform 37
        run: yes | sdkmanager "platforms;android-37" > /dev/null || true

      - name: Decode release keystore
        env:
          KEYSTORE_PASSWORD: ${{ secrets.GLIMPSE_KEYSTORE_PASSWORD }}
        run: echo "${{ secrets.GLIMPSE_KEYSTORE_BASE64 }}" | base64 -d > glimpse-release.jks

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace
        env:
          KEYSTORE_PASSWORD: ${{ secrets.GLIMPSE_KEYSTORE_PASSWORD }}

      - name: Build release APK
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace
        env:
          KEYSTORE_PASSWORD: ${{ secrets.GLIMPSE_KEYSTORE_PASSWORD }}

      - name: Rename APKs
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/Glimpse-debug.apk
          cp app/build/outputs/apk/release/app-release.apk out/Glimpse-release.apk
          ls -la out/

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: Glimpse-apk
          path: out/*.apk
          if-no-files-found: error
